name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: campaigns_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d campaigns_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://app:app@localhost:5433/campaigns_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        working-directory: backend
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        working-directory: backend
        run: go vet ./...
      - name: test (unit + integration, mock LLM, no API key)
        working-directory: backend
        run: go test -race -count=1 ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up (no API key, mock LLM)
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
          curl -fsS localhost:8080/health/ready
          curl -fsS localhost:8081/health/ready
          curl -fsS localhost:3000/ > /dev/null
      - name: logs on failure
        if: failure()
        run: docker compose logs
